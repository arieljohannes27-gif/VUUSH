# VUUSH API — Railway (beachhead)
# REQUIRED in Railway UI: Settings → Root Directory = platform

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
# Liveness only — /ready needs DB and is too strict for rollouts.
# CMD still runs migrate before the server listens.
healthcheckPath = "/health"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
