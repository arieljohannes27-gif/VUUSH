# VUUSH API — Railway (beachhead)
# REQUIRED in Railway UI: Settings → Root Directory = platform

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
# CMD in Dockerfile runs migrate + server (needs DATABASE_URL)
healthcheckPath = "/ready"
healthcheckTimeout = 60
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
